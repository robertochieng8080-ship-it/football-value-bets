name: Generate VIP ACCA Image
on:
  push:
    paths:
      - 'scripts/generate_vip_image.py'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python scripts/generate_vip_image.py
      - run: |
          git config user.name "vip-bot"
          git config user.email "vip-bot@footballvalue.bets"
          git add public/vip-acca.jpg public/vip-acca-mobile.jpg
          git diff --staged --quiet || git commit -m "Auto: generate VIP ACCA graphic"
          git push
